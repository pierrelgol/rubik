[project]
name = "rubik"
version = "0.1.0"
description = "A Rubik's cube solver"
requires-python = ">=3.14"
dependencies = [
    "raylib>=5.5.0.4",
    "setuptools>=80.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "watchfiles>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
